<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Foxopi Savings</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131c;
      color: white;
    }

    .container {
      max-width: 420px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
    }

    .balance-box {
      background: #1c2230;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
    }

    .balance-title {
      color: #999;
      font-size: 14px;
    }

    #balance {
      font-size: 38px;
      font-weight: bold;
      margin-top: 10px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      padding: 18px 8px;
      border: none;
      border-radius: 15px;
      font-size: 15px;
      font-weight: bold;
      color: white;
    }

    .deposit {
      background: #22c55e;
    }

    .withdraw {
      background: #ef4444;
    }

    .calculator {
      background: #3b82f6;
    }

    .history {
      background: #8b5cf6;
    }

    .box {
      margin-top: 20px;
      background: #1c2230;
      border-radius: 18px;
      padding: 18px;
      display: none;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: none;
      border-radius: 10px;
      margin: 8px 0;
      font-size: 16px;
    }

    .action {
      width: 100%;
      background: #2563eb;
      margin-top: 8px;
    }

    .warning {
      color: #aaa;
      text-align: center;
      font-size: 12px;
      margin-top: 25px;
    }

    .history-item {
      padding: 8px;
      border-bottom: 1px solid #333;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💎 FOXOPI</h1>

  <div class="subtitle">
    Savings Simulator
  </div>


  <div class="balance-box">

    <div class="balance-title">
      DEMO BALANCE
    </div>

    <div id="balance">
      $0.00
    </div>

  </div>


  <div class="buttons">

    <button class="deposit" onclick="openBox('depositBox')">
      ➕ Deposit
    </button>

    <button class="withdraw" onclick="openBox('withdrawBox')">
      ➖ Withdraw
    </button>

    <button class="calculator" onclick="openBox('calculatorBox')">
      📈 5% Calculator
    </button>

    <button class="history" onclick="showHistory()">
      📜 History
    </button>

  </div>


  <div id="depositBox" class="box">

    <h3>➕ Demo Deposit</h3>

    <input
      type="number"
      id="depositAmount"
      placeholder="Enter amount"
    >

    <button class="action" onclick="depositMoney()">
      Add Demo Balance
    </button>

  </div>


  <div id="withdrawBox" class="box">

    <h3>➖ Demo Withdraw</h3>

    <input
      type="number"
      id="withdrawAmount"
      placeholder="Enter amount"
    >

    <button class="action" onclick="withdrawMoney()">
      Withdraw
    </button>

  </div>


  <div id="calculatorBox" class="box">

    <h3>📈 5% Savings Calculator</h3>

    <input
      type="number"
      id="years"
      placeholder="Number of years"
    >

    <button class="action" onclick="calculateSavings()">
      Calculate
    </button>

    <p id="result"></p>

  </div>


  <div id="historyBox" class="box">

    <h3>📜 History</h3>

    <div id="historyList">
      No transactions yet.
    </div>

  </div>


  <div class="warning">
    ⚠️ Demo simulator only. No real money or cryptocurrency is accepted.
  </div>

</div>


<script>

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  let balance =
    Number(localStorage.getItem("foxopiBalance")) || 0;


  let history =
    JSON.parse(localStorage.getItem("foxopiHistory")) || [];


  function updateBalance() {

    document.getElementById("balance").innerText =
      "$" + balance.toFixed(2);

    localStorage.setItem(
      "foxopiBalance",
      balance
    );

  }


  function closeBoxes() {

    document.getElementById("depositBox").style.display = "none";

    document.getElementById("withdrawBox").style.display = "none";

    document.getElementById("calculatorBox").style.display = "none";

    document.getElementById("historyBox").style.display = "none";

  }


  function openBox(id) {

    closeBoxes();

    document.getElementById(id).style.display = "block";

  }


  function depositMoney() {

    let amount =
      Number(document.getElementById("depositAmount").value);

    if (amount <= 0) {

      alert("Enter a valid amount");

      return;
    }

    balance += amount;

    history.unshift(
      "➕ Deposit: $" + amount.toFixed(2)
    );

    saveData();

    document.getElementById("depositAmount").value = "";

    alert("Demo deposit added!");

  }


  function withdrawMoney() {

    let amount =
      Number(document.getElementById("withdrawAmount").value);

    if (amount <= 0) {

      alert("Enter a valid amount");

      return;
    }

    if (amount > balance) {

      alert("Insufficient demo balance");

      return;
    }

    balance -= amount;

    history.unshift(
      "➖ Withdraw: $" + amount.toFixed(2)
    );

    saveData();

    document.getElementById("withdrawAmount").value = "";

    alert("Demo withdrawal completed!");

  }


  function calculateSavings() {

    let years =
      Number(document.getElementById("years").value);

    if (years <= 0) {

      alert("Enter number of years");

      return;
    }

    let future =
      balance * Math.pow(1.05, years);

    document.getElementById("result").innerText =
      years +
      " year(s) later: $" +
      future.toFixed(2);

  }


  function showHistory() {

    openBox("historyBox");

    let list =
      document.getElementById("historyList");

    if (history.length === 0) {

      list.innerHTML =
        "No transactions yet.";

      return;

    }

    list.innerHTML = "";

    history.forEach(function(item) {

      let div =
        document.createElement("div");

      div.className =
        "history-item";

      div.innerText =
        item;

      list.appendChild(div);

    });

  }


  function saveData() {

    localStorage.setItem(
      "foxopiHistory",
      JSON.stringify(history)
    );

    updateBalance();

  }


  updateBalance();

</script>

</body>
      </html>
